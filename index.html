<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070b12" />
<meta name="description" content="MY FITNESS PORTFOLIO — a virtual investment dashboard for your workout consistency." />
<title>MY FITNESS PORTFOLIO</title>
<style>
  /* ============================================================
     TOKENS
     ============================================================ */
  :root{
    --bg:#070b12;
    --panel:rgba(255,255,255,0.033);
    --panel-2:rgba(255,255,255,0.055);
    --border:rgba(255,255,255,0.075);
    --border-strong:rgba(255,255,255,0.16);
    --text:#e9f0f9;
    --muted:#8494a9;
    --muted-2:#5b6a7e;
    --green:#2ee08a;
    --green-deep:#0fbf7d;
    --green-soft:rgba(46,224,138,0.12);
    --red:#ff6b78;
    --red-soft:rgba(255,107,120,0.12);
    --radius:22px;
    --shadow:0 24px 60px -30px rgba(0,0,0,0.9);
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,"Helvetica Neue",Arial,sans-serif;
  }

  /* ============================================================
     BASE
     ============================================================ */
  *{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    min-height:100vh;
    font-family:var(--font);
    color:var(--text);
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
    background:
      radial-gradient(1100px 700px at 8% -12%, rgba(46,224,138,0.10), transparent 62%),
      radial-gradient(900px 700px at 102% -6%, rgba(64,120,255,0.10), transparent 58%),
      radial-gradient(900px 900px at 50% 120%, rgba(46,224,138,0.05), transparent 60%),
      var(--bg);
    background-attachment:fixed;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;}
  button{font-family:inherit;}
  ::selection{background:rgba(46,224,138,0.28);}

  /* ============================================================
     LAYOUT
     ============================================================ */
  .app{max-width:1160px;margin:0 auto;padding:26px 20px 70px;}

  /* ============================================================
     TOP BAR
     ============================================================ */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;margin-bottom:26px;flex-wrap:wrap;
  }
  .brand{display:flex;align-items:center;gap:13px;min-width:0;}
  .brand-mark{
    width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;
    background:linear-gradient(160deg, rgba(46,224,138,0.22), rgba(46,224,138,0.03));
    border:1px solid rgba(46,224,138,0.3);
    box-shadow:0 0 26px -8px rgba(46,224,138,0.65);
  }
  .brand-mark svg{width:22px;height:22px;}
  .brand h1{
    margin:0;font-size:0.94rem;font-weight:700;
    letter-spacing:0.17em;white-space:nowrap;
  }
  .brand p{margin:3px 0 0;font-size:0.7rem;color:var(--muted);letter-spacing:0.06em;}

  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap;}

  /* ============================================================
     BUTTONS
     ============================================================ */
  .ghost-btn{
    font:inherit;font-size:.78rem;font-weight:600;letter-spacing:.04em;
    color:var(--text);background:rgba(255,255,255,0.05);
    border:1px solid var(--border);border-radius:11px;
    padding:11px 16px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .15s,color .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .ghost-btn:hover{background:rgba(255,255,255,0.09);border-color:var(--border-strong);}
  .ghost-btn:active{transform:scale(.97);}
  .ghost-btn:disabled{opacity:.38;cursor:not-allowed;transform:none;}
  .ghost-btn.wide{width:100%;margin-top:14px;}

  .primary-btn{
    font:inherit;font-size:.82rem;font-weight:700;
    background:linear-gradient(180deg,#4bf5a4,#0fbf7d);color:#04140c;
    border:0;border-radius:12px;padding:13px 22px;cursor:pointer;
    transition:filter .2s,transform .15s;
  }
  .primary-btn:hover{filter:brightness(1.06);}
  .primary-btn:active{transform:scale(.97);}

  .danger-btn{
    font:inherit;font-size:.78rem;font-weight:700;
    background:var(--red-soft);color:#ff9aa3;
    border:1px solid rgba(255,107,120,0.35);border-radius:11px;
    padding:12px 18px;cursor:pointer;
    transition:background .2s,border-color .2s,transform .15s;
  }
  .danger-btn:hover{background:rgba(255,107,120,0.22);border-color:rgba(255,107,120,0.55);}
  .danger-btn:active{transform:scale(.97);}

  /* ============================================================
     CARDS
     ============================================================ */
  .card{
    background:linear-gradient(180deg, rgba(255,255,255,0.045), rgba(255,255,255,0.017));
    border:1px solid var(--border);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
  }

  /* ============================================================
     HERO
     ============================================================ */
  .hero{position:relative;padding:30px;margin-bottom:16px;overflow:hidden;}
  .hero::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(650px 260px at 0% 0%, rgba(46,224,138,0.14), transparent 70%);
  }
  .hero > *{position:relative;z-index:1;}

  .hero-label{
    display:inline-flex;align-items:center;gap:9px;
    font-size:.7rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    color:var(--muted);
  }
  .dot-live{
    width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 0 0 rgba(46,224,138,0.55);
    animation:livePulse 2.4s ease-out infinite;
  }
  @keyframes livePulse{
    0%{box-shadow:0 0 0 0 rgba(46,224,138,0.5);}
    70%{box-shadow:0 0 0 10px rgba(46,224,138,0);}
    100%{box-shadow:0 0 0 0 rgba(46,224,138,0);}
  }

  .hero-value{display:flex;align-items:baseline;gap:10px;margin:16px 0 10px;flex-wrap:wrap;}
  .currency{
    font-size:clamp(1.05rem,3vw,1.55rem);font-weight:600;
    color:var(--green);letter-spacing:-.01em;
  }
  #balanceValue{
    font-size:clamp(2.7rem,9.5vw,4.7rem);
    font-weight:700;letter-spacing:-.038em;line-height:1;
    background:linear-gradient(180deg,#ffffff 10%,#b9efd4 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .hero-meta{font-size:.78rem;color:var(--muted);min-height:1.2em;}

  .add-btn{
    position:relative;display:inline-flex;align-items:center;gap:10px;
    margin-top:24px;padding:18px 32px;
    font:inherit;font-size:.95rem;font-weight:800;letter-spacing:.13em;
    color:#04140c;
    background:linear-gradient(180deg,#4bf5a4,#0fbf7d);
    border:0;border-radius:16px;cursor:pointer;overflow:hidden;
    box-shadow:0 18px 44px -18px rgba(46,224,138,0.95), inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .16s cubic-bezier(.2,.8,.3,1), box-shadow .25s, filter .2s;
    -webkit-tap-highlight-color:transparent;
  }
  .add-btn:hover{transform:translateY(-2px);box-shadow:0 26px 54px -18px rgba(46,224,138,1), inset 0 1px 0 rgba(255,255,255,0.45);}
  .add-btn:active{transform:translateY(0) scale(.985);}
  .add-btn .plus{font-size:1.2rem;font-weight:700;line-height:1;margin-top:-2px;}

  .hero-hint{
    margin:16px 0 0;font-size:.73rem;color:var(--muted-2);
    max-width:46ch;line-height:1.55;
  }

  .ripple{
    position:absolute;border-radius:50%;background:rgba(255,255,255,0.6);
    transform:scale(0);pointer-events:none;
    animation:rippleOut .65s ease-out forwards;
  }
  @keyframes rippleOut{to{transform:scale(3.4);opacity:0;}}

  @keyframes cardPulse{
    0%{box-shadow:0 0 0 0 rgba(46,224,138,0.35), var(--shadow);}
    100%{box-shadow:0 0 0 22px rgba(46,224,138,0), var(--shadow);}
  }
  .hero.pulse{animation:cardPulse .85s ease-out;}

  /* ============================================================
     STATS
     ============================================================ */
  .stats{
    display:grid;grid-template-columns:repeat(4,minmax(0,1fr));
    gap:14px;margin-bottom:16px;
  }
  .stat{
    position:relative;padding:20px 20px 18px;overflow:hidden;
    display:flex;flex-direction:column;gap:9px;
    transition:transform .2s, border-color .2s;
  }
  .stat::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:2px;
    background:linear-gradient(180deg,var(--green),transparent);opacity:.55;
  }
  .stat:hover{transform:translateY(-2px);border-color:var(--border-strong);}
  .stat-label{
    font-size:.66rem;font-weight:700;letter-spacing:.15em;
    text-transform:uppercase;color:var(--muted);
  }
  .stat-value{
    font-size:clamp(1.45rem,4vw,1.95rem);font-weight:700;letter-spacing:-.025em;
    line-height:1.05;
  }
  .stat-sub{font-size:.71rem;color:var(--muted-2);line-height:1.4;}

  /* ============================================================
     CHART
     ============================================================ */
  .chart-card{padding:22px 22px 12px;margin-bottom:16px;}
  .card-head{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:14px;flex-wrap:wrap;
  }
  .card-head h2{margin:0;font-size:.95rem;font-weight:700;letter-spacing:.015em;}
  .card-sub{margin:5px 0 0;font-size:.73rem;color:var(--muted);}

  .range-tabs{
    display:inline-flex;gap:2px;padding:3px;
    background:rgba(255,255,255,0.04);
    border:1px solid var(--border);border-radius:11px;
  }
  .range-tabs button{
    font:inherit;font-size:.69rem;font-weight:700;letter-spacing:.09em;
    color:var(--muted);background:transparent;border:0;
    padding:7px 12px;border-radius:8px;cursor:pointer;transition:.2s;
  }
  .range-tabs button:hover{color:var(--text);}
  .range-tabs button.active{background:rgba(46,224,138,0.16);color:var(--green);}

  .chart-wrap{position:relative;width:100%;margin-top:12px;}
  .chart-wrap svg{display:block;width:100%;height:auto;}
  .grid{stroke:rgba(255,255,255,0.055);stroke-width:1;stroke-dasharray:3 5;}
  .axis{fill:var(--muted-2);font-size:11px;font-weight:600;letter-spacing:.02em;}

  .chart-empty{
    position:absolute;inset:0;display:grid;place-items:center;
    text-align:center;color:var(--muted);font-size:.8rem;
    padding:26px;line-height:1.6;
  }

  .tooltip{
    position:absolute;pointer-events:none;opacity:0;z-index:3;
    transform:translate(-50%,-125%);
    background:rgba(11,18,27,0.96);
    border:1px solid var(--border-strong);
    border-radius:10px;padding:8px 12px;
    font-size:.7rem;color:var(--muted);white-space:nowrap;
    box-shadow:0 16px 34px -14px #000;
    transition:opacity .15s ease;
  }
  .tooltip strong{
    display:block;margin-top:2px;font-size:.85rem;
    color:var(--green);font-variant-numeric:tabular-nums;
  }

  /* ============================================================
     HISTORY
     ============================================================ */
  .history-card{padding:22px;margin-bottom:16px;}
  .history-list{list-style:none;margin:10px 0 0;padding:0;}

  .tx{
    display:flex;align-items:center;gap:14px;
    padding:14px 2px;
    border-bottom:1px solid rgba(255,255,255,0.05);
    animation:rowIn .38s cubic-bezier(.2,.8,.3,1) both;
  }
  .tx:last-child{border-bottom:0;}
  @keyframes rowIn{from{opacity:0;transform:translateY(-6px);}to{opacity:1;transform:none;}}

  .tx-dot{
    width:36px;height:36px;flex:none;border-radius:12px;
    display:grid;place-items:center;
    background:var(--green-soft);color:var(--green);
    border:1px solid rgba(46,224,138,0.22);
    font-size:.8rem;font-weight:700;
  }
  .tx-main{flex:1;min-width:0;}
  .tx-date{font-size:.85rem;font-weight:600;letter-spacing:.01em;}
  .tx-time{font-size:.71rem;color:var(--muted-2);margin-top:2px;font-variant-numeric:tabular-nums;}
  .tx-right{text-align:right;flex:none;}
  .tx-amount{
    display:block;font-size:.9rem;font-weight:700;color:var(--green);
    font-variant-numeric:tabular-nums;letter-spacing:-.01em;
  }
  .tx-balance{
    display:block;margin-top:2px;font-size:.68rem;color:var(--muted-2);
    font-variant-numeric:tabular-nums;
  }
  .history-empty{
    padding:30px 10px;text-align:center;
    color:var(--muted-2);font-size:.8rem;
  }

  /* ============================================================
     DATA CARD
     ============================================================ */
  .data-card{padding:22px;}
  .data-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}

  /* ============================================================
     FOOTER
     ============================================================ */
  .footer{
    margin-top:26px;text-align:center;
    font-size:.7rem;color:var(--muted-2);line-height:1.7;
  }

  /* ============================================================
     MODAL
     ============================================================ */
  .modal-overlay{
    position:fixed;inset:0;z-index:60;padding:20px;
    display:grid;place-items:center;
    background:rgba(3,6,10,0.76);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    opacity:0;pointer-events:none;transition:opacity .22s ease;
  }
  .modal-overlay.open{opacity:1;pointer-events:auto;}
  .modal{
    width:min(440px,100%);
    background:#0d1520;border:1px solid var(--border-strong);
    border-radius:20px;padding:26px;
    box-shadow:0 40px 90px -30px #000;
    transform:translateY(14px) scale(.98);
    transition:transform .28s cubic-bezier(.2,.8,.3,1);
  }
  .modal-overlay.open .modal{transform:none;}
  .modal h3{margin:0 0 10px;font-size:1.02rem;font-weight:700;}
  .modal p{margin:0;font-size:.82rem;line-height:1.65;color:var(--muted);}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:10px;
    margin-top:24px;flex-wrap:wrap;
  }

  /* ============================================================
     TOASTS
     ============================================================ */
  .toasts{
    position:fixed;left:50%;bottom:26px;z-index:80;
    transform:translateX(-50%);
    display:flex;flex-direction:column;gap:8px;align-items:center;
    width:max-content;max-width:calc(100vw - 32px);
    pointer-events:none;
  }
  .toast{
    background:rgba(14,22,33,0.97);
    border:1px solid var(--border-strong);
    border-radius:12px;padding:11px 17px;
    font-size:.79rem;font-weight:600;
    box-shadow:0 18px 44px -18px #000;
    animation:toastIn .3s cubic-bezier(.2,.8,.3,1);
  }
  .toast.success{border-color:rgba(46,224,138,0.38);color:#b6f7d5;}
  .toast.error{border-color:rgba(255,107,120,0.42);color:#ffc6cb;}
  .toast.out{animation:toastOut .28s ease forwards;}
  @keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96);}to{opacity:1;transform:none;}}
  @keyframes toastOut{to{opacity:0;transform:translateY(10px) scale(.97);}}

  /* ============================================================
     CELEBRATION
     ============================================================ */
  .reward-float{
    position:fixed;z-index:90;pointer-events:none;
    font-size:1.12rem;font-weight:800;letter-spacing:.02em;
    color:var(--green);
    text-shadow:0 0 24px rgba(46,224,138,0.8);
    transform:translate(-50%,-50%);
    animation:rewardFloat 1.35s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rewardFloat{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.75);}
    16%{opacity:1;transform:translate(-50%,-85%) scale(1.05);}
    100%{opacity:0;transform:translate(-50%,-360%) scale(1);}
  }
  .spark{
    position:fixed;z-index:89;pointer-events:none;
    width:6px;height:6px;border-radius:50%;
    background:var(--green);
    box-shadow:0 0 12px rgba(46,224,138,0.9);
    animation:sparkFly .95s ease-out forwards;
  }
  @keyframes sparkFly{
    from{opacity:1;transform:translate(-50%,-50%) scale(1);}
    to{opacity:0;transform:translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(.15);}
  }

  /* ============================================================
     RESPONSIVE
     ============================================================ */
  @media (max-width:900px){
    .stats{grid-template-columns:repeat(2,minmax(0,1fr));}
  }
  @media (max-width:640px){
    .app{padding:18px 14px 60px;}
    .card{border-radius:18px;}
    .hero{padding:24px 20px;}
    .chart-card,.history-card,.data-card{padding:18px 16px;}
    .brand h1{font-size:.82rem;letter-spacing:.13em;}
    .brand p{font-size:.65rem;}
    .brand-mark{width:38px;height:38px;border-radius:12px;}
    .topbar-actions .ghost-btn{padding:9px 13px;font-size:.72rem;}
    .add-btn{width:100%;justify-content:center;padding:17px 24px;}
    .tx{gap:11px;}
    .tx-dot{width:32px;height:32px;border-radius:10px;}
    .tx-date{font-size:.8rem;}
    .tx-amount{font-size:.84rem;}
    .tx-balance{font-size:.64rem;}
    .data-actions .ghost-btn,
    .data-actions .danger-btn{flex:1 1 auto;text-align:center;}
  }
  @media (max-width:380px){
    .stats{grid-template-columns:1fr;}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation-duration:.001ms !important;
      animation-iteration-count:1 !important;
      transition-duration:.001ms !important;
    }
  }
</style>
</head>
<body>

<div class="app">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#2ee08a" stroke-width="2.1"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 17l5-5 4 3 8-8"/>
          <path d="M15 7h5v5"/>
        </svg>
      </div>
      <div>
        <h1>MY FITNESS PORTFOLIO</h1>
        <p>Consistency compounds.</p>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="ghost-btn" id="exportBtn" type="button">↓ Export</button>
      <button class="ghost-btn" id="importBtn" type="button">↑ Import</button>
      <input type="file" id="importFile" accept="application/json,.json" hidden />
    </div>
  </header>

  <!-- ================= HERO ================= -->
  <section class="card hero" id="heroCard">
    <span class="hero-label"><span class="dot-live"></span> Total Virtual Wealth</span>

    <div class="hero-value">
      <span class="currency">HK$</span>
      <span id="balanceValue" class="num">0</span>
    </div>

    <div class="hero-meta" id="heroMeta">No workouts yet — your first one is worth HK$50.</div>

    <button class="add-btn" id="addWorkout" type="button">
      <span class="plus">+</span> ADD WORKOUT
    </button>

    <p class="hero-hint">
      Each completed planned workout earns HKD&nbsp;$50 in virtual wealth.
      Rest days and missed sessions cost nothing — the portfolio only grows.
    </p>
  </section>

  <!-- ================= STATS ================= -->
  <section class="stats">
    <div class="card stat">
      <span class="stat-label">Completed Workouts</span>
      <span class="stat-value num" id="statWorkouts">0</span>
      <span class="stat-sub">sessions logged</span
